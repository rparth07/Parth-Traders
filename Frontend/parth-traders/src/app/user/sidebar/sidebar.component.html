<div class="filter-panel"><div class="filter-title"><h2>Filters</h2><button type="button" class="text-button" (click)="resetFilters()">Clear all</button></div>
<fieldset *ngIf="categories.length"><legend>Category</legend><label *ngFor="let category of categories" class="filter-choice"><input type="checkbox" [checked]="isChecked(category)" (change)="toggleCategory($event,category)"><span>{{category}}</span></label></fieldset>
<fieldset><legend>Product type</legend><label *ngFor="let type of productTypeKeys" class="filter-choice"><input type="checkbox" [checked]="type===filterCriteria.activeProductType" (change)="setActiveProductType(type)"><span>{{type}}</span></label></fieldset>
<fieldset><legend>Price per unit (USD)</legend><div class="price-inputs"><label>Minimum<input type="number" min="0" step="0.01" [(ngModel)]="minValue" (ngModelChange)="filterByPrice()"></label><label>Maximum<input type="number" min="0" step="0.01" [(ngModel)]="maxValue" (ngModelChange)="filterByPrice()"></label></div><p *ngIf="minValue!==null&&maxValue!==null&&minValue>maxValue" role="status">Minimum must not exceed maximum.</p></fieldset>
<fieldset><legend>Customer rating</legend><label *ngFor="let rating of [4,3,2,1]" class="filter-choice"><input type="radio" name="rating" [checked]="filterCriteria.ratingRange.min===rating" (change)="updateMinRating(rating)"><span>{{rating}} stars &amp; up</span></label><button type="button" class="text-button" (click)="clearRating()">Any rating</button></fieldset></div>
