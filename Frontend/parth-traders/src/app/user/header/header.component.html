<header class="store-header"><div class="store-container header-layout">
  <a class="brand" routerLink="/user/home" aria-label="Parth Traders home"><img src="assets/images/parth-traders.png" alt="Parth Traders" width="138" height="58"></a>
  <form class="store-search" *ngIf="shouldDisplaySearchBox" (ngSubmit)="searchProduct('clicked',searchText)" role="search">
    <label class="sr-only" for="search-category">Product category</label><select id="search-category" name="category" [(ngModel)]="selectedCategory" (ngModelChange)="searchProduct('clicked',searchText)"><option *ngFor="let category of categories" [value]="category">{{category}}</option></select>
    <label class="sr-only" for="search-products">Search products</label><input id="search-products" name="search" type="search" [(ngModel)]="searchText" (input)="searchProduct('input',searchText)" placeholder="Search products or SKU"><button type="submit" aria-label="Search products"><mat-icon aria-hidden="true">search</mat-icon></button>
  </form>
  <nav aria-label="Customer navigation"><ng-container *ngIf="isAuthenticated();else guest"><span class="customer-name" [title]="customerName">{{customerName}}</span><button type="button" (click)="signOut()">Sign out</button></ng-container><ng-template #guest><a routerLink="/user/authenticate">Sign in</a></ng-template><a routerLink="/user/orders">My orders</a><a class="cart-link" routerLink="/user/checkout" [attr.aria-label]="'Shopping cart, ' + totalOrderItems + ' items'"><mat-icon aria-hidden="true">shopping_basket</mat-icon><span>Cart ({{totalOrderItems}})</span></a></nav>
</div></header>
