<p *ngIf="loadError" role="alert">{{loadError}} <button type="button" (click)="getCategories()">Try again</button>
</p>
<p *ngIf="loading$ | async" role="status">Loading categories...</p>
<div class="modal-container">
  <div class="row justify-content-around">
    <div class="col-7 col-md-10">
      <mat-card>
        <mat-card-header>
          <mat-card-title>Category</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div class="row justify-content-between">
            <div class="col-3 col-md-3 pe-0">
              <form #filter="ngForm" class="d-flex form-inline search-box" (submit)="applyFilter(filter.value)">
                <input name="searchValue" id="search" class="form-control" type="search" placeholder="Search..."
                  aria-label="Search" autocomplete="off" ngModel />
                <button type="submit" id="searchButton" class="p-2">
                  <mat-icon aria-hidden="false" aria-label="search icon" fontIcon="search">
</mat-icon>
                </button>
              </form>
            </div>

            <div class="col-5 ps-0">
              <div class="add-category">
                <input type="file" id="fileLoader" name="files" title="Load File" hidden accept=".csv" #fileUpload
                  (change)="addCsv($event)" />
                <button id="add-category-file" type="button" class="btn text-light pushable"
                  (click)="fileUpload.click()">
                  <span class="front">Add CSV</span>
                </button>
                <button type="button" class="btn text-light pushable" id="add-category-btn"
                  (click)="openUpdateCategoryModal()">
                  <span class="front">Add Category</span>
                </button>
              </div>
            </div>
          </div>
          <p class="table-scroll-hint">Scroll horizontally to view all columns and actions.</p>
<div class="admin-table-scroll" role="region" aria-label="Categories table" tabindex="0">
<table mat-table [dataSource]="dataSource" matSort class="w-100 mt-2 white-arrow">
            <ng-container *ngFor="let column of columns" [matColumnDef]="column.columnDef">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>
                {{ column.header }}
              </th>
              <td mat-cell *matCellDef="let row">{{ column.cell(row) }}</td>
            </ng-container>
            <ng-container matColumnDef="actions">
<th mat-header-cell *matHeaderCellDef>Actions</th>
<td mat-cell *matCellDef="let row">
<div class="row-actions">
<button type="button" (click)="openUpdateCategoryModal(row)" [attr.aria-label]="'Edit '+row.categoryName">Edit</button>
<button type="button" class="danger" (click)="deleteCategory(row)" [attr.aria-label]="'Delete '+row.categoryName">Delete</button>
</div>
</td>
</ng-container>
<tr mat-header-row *matHeaderRowDef="displayedColumns">
</tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns">
</tr>
          </table>
<p *ngIf="!loadError && !(loading$ | async) && dataSource.filteredData.length === 0" role="status" class="p-3">No matching categories. Try a different search.</p>
</div>
          <mat-paginator #paginator [length]="dataLength" [pageSize]="5" [pageSizeOptions]="[5, 10, 25, 100]"
            aria-label="Select page">
          </mat-paginator>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
