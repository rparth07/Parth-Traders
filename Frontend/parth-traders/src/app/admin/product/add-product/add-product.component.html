<div class="modal-header">
  <h2 class="mt-2">{{ product ? "Update" : "Add" }} Product</h2>
</div>
<div class="modal-body">
  <form class="form-design ps-4 pe-4 pb-3" #form="ngForm">
    <div class="row mt-3">
      <label for="product-name" class="form-label">Name</label>
      <input type="text" class="form-control" id="product-name" placeholder="e.g Belt" required
        [ngModel]="product?.productName" name="productName" />
    </div>
    <div class="row mt-3">
      <label for="product-sku" class="form-label">SKU</label>
      <input type="text" class="form-control" id="product-sku" placeholder="e.g Belt-001" required
        [ngModel]="product?.productSku" name="productSku" />
    </div>
    <div class="row mt-3">
      <label for="product-type" class="form-label">Product Type</label>
      <select class="form-control" id="product-type" [ngModel]="product?.productType ?? 0" name="productType" required>
        <option *ngFor="let type of productKeys()" [ngValue]="productType[type]">{{type}}</option>
      </select>
    </div>
    <div class="row mt-3">
      <label for="product-description" class="form-label">Product Description</label>
      <input type="text" class="form-control" id="product-description" placeholder="e.g This is v-belt" required
        [ngModel]="product?.productDescription" name="productDescription" />
    </div>
    <div class="row mt-3">
      <label for="supplier-name" class="form-label">Supplier Name</label>
      <input type="text" class="form-control" id="supplier-name" placeholder="Supplier unavailable" [required]="!product" [readOnly]="!!product"
        [ngModel]="product?.supplierName" name="supplierName" />
    </div>
    <div class="row mt-3">
      <label for="category-name" class="form-label">Category Name</label>
      <input type="text" class="form-control" id="category-name" placeholder="Category unavailable" [required]="!product" [readOnly]="!!product"
        [ngModel]="product?.categoryName" name="categoryName" />
    </div>
    <div class="row mt-3">
      <label for="pieces-per-unit" class="form-label">Pieces per unit</label>
      <input type="number" class="form-control" id="pieces-per-unit" placeholder="e.g 20" required
        [ngModel]="product?.piecesPerUnit" name="piecesPerUnit" />
    </div>
    <div class="row mt-3">
      <label for="single-piece-MRP" class="form-label">Single piece MRP</label>
      <input type="number" class="form-control" id="single-piece-MRP" step="0.01" min="0" placeholder="e.g 200 Rs" required
        [ngModel]="product?.singlePieceMRP" name="singlePieceMRP" />
    </div>
    <div class="row mt-3">
      <label for="unit-price" class="form-label">Unit price</label>
      <input type="number" class="form-control" id="unit-price" step="0.01" min="0" placeholder="e.g 5000 Rs" required
        [ngModel]="product?.unitPrice" name="unitPrice" />
    </div>
    <div class="row mt-3">
      <label for="discount" class="form-label">Discount</label>
      <input type="number" class="form-control" id="discount" step="0.01" min="0" placeholder="e.g 50 Rs" required
        [ngModel]="product?.discount" name="discount" />
    </div>
    <div class="row mt-3">
      <label for="units-in-stock" class="form-label">Units in stocks</label>
      <input type="number" class="form-control" id="units-in-stock" placeholder="e.g 50" required
        [ngModel]="product?.unitsInStock" name="unitsInStock" />
    </div>
  </form>
</div>

<div class="modal-footer">
  <div>
    <button class="btn btn-primary text-light me-1" [disabled]="!form.valid"
      (click)="product ? updateProduct(form, product) : addProduct(form)">
      {{ product ? "Update" : "Add" }}
    </button>
    <button type="reset" class="btn btn-danger cancel-button text-light ms-1" id="cancel" (click)="closeModal()">
      Cancel
    </button>
  </div>
</div>
