<section class="modal-container">
<div class="panel">
<h1>Administrator profile</h1>
<p>Username: <strong>{{admin.userName}}</strong>
</p>
<p role="status">{{message}}</p>
<form #form="ngForm" (ngSubmit)="updateProfile(form)">
<div>
<label for="admin-firstname">First name</label>
<input id="admin-firstname" class="form-control" name="firstName" autocomplete="given-name" [(ngModel)]="admin.firstName">
</div>
<div>
<label for="admin-lastname">Last name</label>
<input id="admin-lastname" class="form-control" name="lastName" autocomplete="family-name" [(ngModel)]="admin.lastName">
</div>
<div>
<label for="admin-email">Email address</label>
<input id="admin-email" class="form-control" name="email" type="email" email autocomplete="email" [(ngModel)]="admin.email">
</div>
<div>
<label for="admin-phone">Phone number</label>
<input id="admin-phone" class="form-control" name="phoneNumber" type="tel" autocomplete="tel" [(ngModel)]="admin.phoneNumber">
</div>
<button type="submit" class="store-button" [disabled]="form.invalid||saving">{{saving?'Saving…':'Save profile'}}</button>
</form>
</div>
</section>
